<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CredScan AI — Credential Exposure Audit Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        background: #0f0d0a;
        color: #e8d5a3;
        font-family: 'Source Serif 4', Georgia, serif;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root { min-height: 100vh; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #1a1610; }
      ::-webkit-scrollbar-thumb { background: #3a3020; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #c4a35a; }
      ::selection { background: #c4a35a30; color: #e8d5a3; }
      button { cursor: pointer; }
      input, textarea, select { font-family: inherit; }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes scanLine {
        0% { transform: translateY(0); opacity: 0.8; }
        100% { transform: translateY(100%); opacity: 0; }
      }
      .spin { animation: spin 0.8s linear infinite; }
      .pulse { animation: pulse 1.5s ease-in-out infinite; }
      .fadeIn { animation: fadeIn 0.3s ease-out; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
